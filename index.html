<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delta TBQS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0a0a0a;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .snow-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .snowflake {
            position: absolute;
            top: -10px;
            color: #fff;
            font-size: 1em;
            opacity: 0.7;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.7;
            }
            100% {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0.2;
            }
        }

        .top-navbar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: #111111;
            border-bottom: 1px solid #222222;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            z-index: 10;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
        }

        .nav-username {
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 1px;
            color: #e0e0e0;
        }

        .pulsing-icon {
            color: #2ecc71;
            font-size: 1.5rem;
            animation: pulse 1.5s infinite alternate;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                text-shadow: 0 0 5px rgba(46, 204, 113, 0.4);
            }
            100% {
                transform: scale(1.2);
                text-shadow: 0 0 20px rgba(46, 204, 113, 1);
            }
        }

        .main-card {
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            width: 90%;
            max-width: 480px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            z-index: 5;
            position: relative;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .profile-img {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #333;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        .app-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .profile-name {
            font-size: 1.3rem;
            font-weight: 800;
            color: #ffffff;
        }

        .app-name-sub {
            font-size: 0.9rem;
            color: #888888;
        }

        .alert-box {
            background-color: rgba(231, 76, 60, 0.1);
            border: 1px solid rgba(231, 76, 60, 0.3);
            border-radius: 8px;
            padding: 12px;
            font-size: 0.85rem;
            color: #ff4d4d;
            text-align: center;
            font-weight: bold;
            line-height: 1.5;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .installing-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 0.9rem;
            color: #aaa;
            margin-top: 5px;
        }

        .spinner {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(-360deg); }
        }
    </style>
</head>
<body>

    <div class="top-navbar">
        <span class="nav-username">RFX 7zen</span>
        <i class="fa-solid fa-shield-halved pulsing-icon"></i>
    </div>

    <div class="snow-container" id="snow"></div>

    <div class="main-card">
        <div class="card-header">
            <img src="https://i.ibb.co/1fdL8ycp/IMG-3266.png" alt="DeltaVN" class="profile-img">
            <div class="app-info">
                <span class="profile-name">__drb7h</span>
                <span class="app-name-sub">DeltaVN</span>
            </div>
        </div>

        <div class="alert-box">
            دلتا فيتنام لو تحول حسابك لفيتنام حنا مالنا شغل 🛑
        </div>

        <div class="installing-status">
            <i class="fa-solid fa-circle-notch spinner"></i>
            <span>سيتم تثبيت دلتا فيتنام تلقائي اذا جاك مبروك</span>
        </div>
    </div>

    <script>
        const installUrl = "itms-services://?action=download-manifest&url=https://bot.ipasign.cc/dl/20260618215509863/MVXl93eQRYCc.plist";

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                window.location.href = installUrl;
            }, 1000);
        });

        const snowContainer = document.getElementById('snow');
        const flakeCount = 40;

        for (let i = 0; i < flakeCount; i++) {
            const flake = document.createElement('div');
            flake.classList.add('snowflake');
            flake.innerHTML = '❄';
            
            flake.style.left = Math.random() * 100 + 'vw';
            flake.style.animationDuration = (Math.random() * 3 + 2) + 's'; 
            flake.style.animationDelay = Math.random() * 5 + 's';
            flake.style.fontSize = (Math.random() * 0.6 + 0.6) + 'em';
            
            snowContainer.appendChild(flake);
        }
    </script>
</body>
</html>
